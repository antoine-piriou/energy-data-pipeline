[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-data-pipeline"
version = "0.1.0"
description = "Ingests open electricity data (RTE eCO2mix, ENTSO-E, Open-Meteo) into partitioned raw files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Antoine Piriou" },
]
keywords = ["energy", "electricity", "data-pipeline", "rte", "entso-e"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/antoine-piriou/energy-data-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
